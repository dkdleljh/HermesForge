apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermesforge-engine
spec:
  replicas: 10 # 대규모 병렬 Multiverse 분산을 위한 10개의 Worker Nodes
  selector:
    matchLabels:
      app: hermesforge
  template:
    metadata:
      labels:
        app: hermesforge
    spec:
      containers:
      - name: engine
        image: hermesforge:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENTROPY_BUDGET
          value: "1.0"
---
apiVersion: v1
kind: Service
metadata:
  name: hermesforge-service
spec:
  type: ClusterIP
  selector:
    app: hermesforge
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
